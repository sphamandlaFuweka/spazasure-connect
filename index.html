<style>
  :root {
    --navy: #1b2566;
    --navy-light: #2f43a0;
    --ink: #151d52;
    --yellow: #fbbf24;
    --muted: #d6dcff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: 'Nunito', system-ui, sans-serif;
    color: #fff;
    background: radial-gradient(circle at 50% 45%, var(--navy-light) 0%, var(--navy) 70%);
    background-color: var(--navy);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  main {
    flex: 1;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    padding: clamp(28px, 6vh, 64px) 16px 40px;
    text-align: center;
  }
  .brand { display: inline-flex; align-items: center; gap: 14px; text-decoration: none; color: #fff; }
  .brand img {
    width: clamp(52px, 13vw, 72px); height: auto; aspect-ratio: 1;
    border-radius: 50%; background: #fff; padding: 5px;
  }
  .brand span { font-weight: 900; font-size: clamp(30px, 8.5vw, 44px); letter-spacing: -0.5px; }
  h1 {
    font-weight: 900;
    font-size: clamp(34px, 9.5vw, 52px);
    line-height: 1.05;
    margin: clamp(24px, 5vh, 40px) 0 12px;
    letter-spacing: -0.5px;
    text-wrap: balance;
  }
  h1 em { font-style: normal; color: var(--yellow); }
  .sub { color: var(--muted); font-weight: 700; font-size: clamp(15px, 4vw, 18px); margin: 0 0 28px; }

  .actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .action {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    min-height: 96px; padding: 14px 8px;
    border-radius: 18px;
    color: #fff; text-decoration: none;
    font-weight: 800; font-size: 15px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, .18);
    transition: transform .15s ease, filter .15s ease;
  }
  .action:hover { transform: translateY(-2px); filter: brightness(1.08); }
  .action:active { transform: scale(.97); }
  .action:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
  .action svg { width: 30px; height: 30px; }
  .whatsapp { background: #25d366; }
  .call { background: #151d52; }
  .email { background: #e3262d; }
  .web { background: #0d8a4f; }
  .facebook { background: #1877f2; }
  .linkedin { background: #0a66c2; }

  .save {
    margin-top: 16px; width: 100%;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    padding: 16px; border: 0; border-radius: 16px;
    background: var(--yellow); color: var(--ink);
    font: inherit; font-weight: 900; font-size: 17px; cursor: pointer;
    box-shadow: 0 8px 20px rgba(0, 0, 0, .18);
  }
  .save svg { width: 22px; height: 22px; }
  .save:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  .share { margin-top: 40px; }
  .share p { color: var(--muted); font-weight: 700; margin: 0 0 14px; font-size: 15px; }
  .qr {
    width: min(280px, 78vw);
    margin: 0 auto;
    background: #fff; border-radius: 28px;
    padding: clamp(18px, 5vw, 28px);
    box-shadow: 0 20px 40px rgba(0, 0, 0, .25);
  }
  .qr svg { display: block; width: 100%; height: auto; }

  .stripe { display: flex; height: 10px; }
  .stripe i { flex: 1; }

  @media (max-width: 340px) {
    .actions { grid-template-columns: repeat(2, 1fr); }
  }
</style>
